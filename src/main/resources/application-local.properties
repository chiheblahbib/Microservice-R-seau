# ===============================
# DATASOURCE DIALECT CONFIG
# ===============================

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# ===============================
# FEIGN KERNEL CLIENT CONFIG
# ===============================
feign.kernel.url=http://192.168.10.192:8002/mskernel/api
feign.kernel.name=msdevkv1


# ===============================
# FEIGN SELF CLIENT CONFIG
# ===============================
# Aucun @FeignClient ne lit ces deux cles aujourd'hui : le service ne
# s'appelle pas lui-meme. Elles sont conservees par symetrie avec les
# autres services de la suite, mais corrigees -- elles designaient le
# port et le nom d'implantation, dont ce fichier est une copie.
feign.drrrs.url=http://192.168.10.192:8005/drrrs/api
feign.drrrs.name=drrrs

# ===============================
# FEIGN REFERENTIEL CLIENT CONFIG
# ===============================
feign.referentiel.url=http://192.168.70.54:8081/referentiel/api
feign.referentiel.name=referentiel

# ===============================
# EUREKA CLIENT CONFIG
# ===============================

eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.serviceUrl.defaultZone=http://arcep-eureka.picosoft.biz:8101/eureka-server/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=192.168.10.191
eureka.instance.non-secure-port=8002
eureka.instance.metadata-map.management.context-path=/actuator
eureka.instance.instance-id=${eureka.instance.hostname}:${spring.application.name}:${server.port}


# ===============================
# APPLICATION CONFIG
# ===============================

spring.application.name=drrrs


# ===============================
# SERVER CONFIG
# ===============================

server.port=8005
server.servlet.context-path=/

# ===============================
# MANAGMENT CONFIG
# ===============================

management.server.port=8005
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=*
